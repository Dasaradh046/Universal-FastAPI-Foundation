# Alembic Configuration File
[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename of the migration itself.
# If specified as a tzinfo datetime or as a string
#  like "America/Los_Angeles" will be passed to
#  time.strftime().
# If left as None, the system timezone is used.
# timezone =

# max length of characters to apply to the
# "version path" function.
# This is used when generating revision files
# and defaults to 255 characters.
# version_path_source = alembic.utils
# version_path_parts = 4
# version_path_suffix =

# The output encoding used when revision files
# are written from script.py
# output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers =
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s