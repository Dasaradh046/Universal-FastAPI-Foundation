[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-fastapi-foundation"
version = "0.1.0"
description = "A reusable, integration-ready FastAPI application platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Developer", email = "developer@example.com"}
]
keywords = ["fastapi", "backend", "foundation", "modular"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Dependencies
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.25.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "cryptography>=42.0.0",
    "prometheus-client>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "pre-commit>=3.7.0",
    "locust>=2.15.0",
]

mfa = [
    "pyotp>=2.9.0",
    "qrcode>=7.5.0",
]

email = [
    "aiosmtplib>=2.0.0",
    "jinja2>=3.1.0",
]

storage = [
    "boto3>=1.34.0",  # For S3
    "minio>=7.2.0",   # For MinIO
]

ai = [
    "openai>=1.0.0",
    "anthropic>=0.5.0",
    "google-generativeai>=0.5.0",
]

observability = [
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.24b0",
]

[project.urls]
Homepage = "https://github.com/example/universal-fastapi-foundation"
Documentation = "https://github.com/example/universal-fastapi-foundation#readme"
Repository = "https://github.com/example/universal-fastapi-foundation"

[tool.setuptools.packages.find]
include = ["app*", "packages*"]

[tool.ruff]
line-length = 88
target-version = "py312"
select = ["E", "F", "W", "C90", "I"]
ignore = []

[tool.ruff.isort]
known-first-party = ["app", "packages"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = [
    "app/tests",
    "tests",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--cov=app",
    "--cov-report=term-missing"
]
asyncio_mode = "auto"
