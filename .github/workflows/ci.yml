name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12, "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ubf_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'uv'

    - name: Install uv
      run: pip install uv

    - name: Install dependencies
      run: uv sync --all-extras --dev

    - name: Run linting (ruff check)
      run: uv run ruff check .

    - name: Run formatting check (ruff format --check)
      run: uv run ruff format --check .

    - name: Run type checking (mypy)
      run: uv run mypy app/

    - name: Run tests with coverage
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ubf_test
        DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/ubf_test
        ENVIRONMENT: testing
        DEBUG: "False"
        SECRET_KEY: test-secret-key-for-testing-purposes-min-32-chars
        ENCRYPTION_KEY: test-encryption-key-32-chars-long!
        JWT_ALGORITHM: HS256
        OTEL_ENABLED: "False"
        SENTRY_DSN: ""
      run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/universal-fastapi-foundation:latest
